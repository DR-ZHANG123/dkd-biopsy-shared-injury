      PODO: {GLOM: PODO, TUB: GLOM}
      MES: {GLOM: MES_VSMC, TUB: GLOM}
      PEC: {GLOM: PEC, TUB: GLOM}
      PT: PT
      LOH: {GLOM: DIST, TUB: TAL}
      DCT: {GLOM: DIST, TUB: DCT}
      CNT_PC: {GLOM: DIST, TUB: PC}
      IC: {GLOM: DIST, TUB: IC}
      STROMA: FIB
      PERI: {GLOM: MES_VSMC, TUB: VSMC}
      ENDO_PT: EC
      MAC: MYE
      TCELL: TNK
      BCELL: BPL
    glom_epithelial: [PODO, PEC]
    tub_epithelial: [PT, DTL_ATL, TAL, DCT, CNT, PC, IC]
    ec_gc_states: [EC-GC, aEC-GC, dEC-GC]
    min_unit_n: 15
    cv_reps: 10
    random_set_size: 50                   # R² 对照：随机基因集（每集基因数）平均秩
  pilot:
    - {series: GSE175759-RNAseq, compartment: TUB}
    - {series: GSE142025-RNAseq, compartment: WHOLE}
    - {series: GSE47183-GPL14663, compartment: GLOM}
    - {series: GSE104954-GPL24120, compartment: TUB}
