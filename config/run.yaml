    # 亚群份额在状态层读取（例如 EC-GC 占肾小球 bulk 的比例 = θ_state 的 EC-GC 系列之和）
    common: &common
      EC: [EC-GC, aEC-GC, dEC-GC, EC-AA, EC-EA, dEC-EA, EC-PTC, aEC-PTC, dEC-PTC, angEC-PTC, infEC-PTC, EC-AVR, dEC-AVR,
