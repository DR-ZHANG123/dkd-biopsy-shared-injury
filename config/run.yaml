      VSMC: [VSMC, VSMC/P, dVSMC, REN]
      FIB: [FIB, M-FIB, dFIB, dM-FIB, infFIB, pvFIB, MYOF]
      MYE: [resMAC, moMAC, moMAC-INF, cycMAC, MON, DC, MAST, N]
      LYM: [T, cycT, NK, B, PL]
      PT: [PT-S1, PT-S2, PT-S3, aPT, dPT, frPT, cycPT]
      DIST: [DTL1, DTL2, DTL3, dDTL, ATL, aDTL, dATL, C-TAL, C/M-TAL, M-TAL, dM-TAL, aTAL, dC-TAL, frTAL, cycTAL, MD, DCT, aDCT, dDCT, CNT, aCNT, dCNT, C-PC, M-PC, dM-PC, IMCD, dIMCD, C-IC-A, M-IC-A, dC-IC-A, dM-IC-A, IC-B, tPC-IC]
    TUB:
      PT: [PT-S1, PT-S2, PT-S3, aPT, dPT, frPT, cycPT]
      LOH: [DTL1, DTL2, DTL3, dDTL, ATL, aDTL, dATL, C-TAL, C/M-TAL, M-TAL, dM-TAL, aTAL, dC-TAL, frTAL, cycTAL, MD]
      DCT: [DCT, aDCT, dDCT]
      CNT: [CNT, aCNT, dCNT]
      PC: [C-PC, M-PC, dM-PC, IMCD, dIMCD]
      IC: [C-IC-A, M-IC-A, dC-IC-A, dM-IC-A, IC-B, tPC-IC]
      EC: [EC-AA, EC-EA, dEC-EA, EC-PTC, aEC-PTC, dEC-PTC, angEC-PTC, infEC-PTC, EC-AVR, dEC-AVR, infEC-AVR, EC-DVR, aEC-DVR, EC-PCV, EC-V, EC-LYM, cycEC]
      VSMC: [VSMC, VSMC/P, dVSMC, REN]
      FIB: [FIB, M-FIB, dFIB, dM-FIB, infFIB, pvFIB, MYOF]
      MYE: [resMAC, moMAC, moMAC-INF, cycMAC, MON, DC, MAST, N]
      LYM: [T, cycT, NK, B, PL]
      GLOM: [POD, dPOD, PEC, EC-GC, aEC-GC, dEC-GC, MC]
  prior:                                  # Dirichlet 模拟：一半样本围绕区室先验均值（浓度对数均匀），一半为稀疏宽先验
    GLOM: {PODO: 0.20, PEC: 0.06, EC_GC: 0.28, MES: 0.18, EC_OTHER: 0.04, VSMC: 0.03, FIB: 0.03, MYE: 0.03, LYM: 0.02, PT: 0.08, DIST: 0.05}
    TUB: null                             # null = 训练供体的皮质 snRNA 平均组成
