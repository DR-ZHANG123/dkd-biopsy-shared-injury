# ---- stage 18：冻结 RRG-ID 的解释与关键细胞程序 / 关键基因验证；以下键均为新增，不改冻结设计 ----
interpret:
  device: cuda:0
  models_dir: models/18_interpret         # 每个 (fold, seed) 的线性等效权重 npz（不进 git）
  e1_all_units: true                      # E1：区室内每个含病人的单元各留出一次（与 stage 15 E1 同构、DKD 留在训练集）
  top_k: 100                              # 基因 Top-k 重合 / 频率所用 k
  prog_top_k: 5                           # 程序 Top-k 重合所用 k
  min_topk_freq: 0.6                      # 关键基因：在 ≥ 该比例的 E1 fold 中进入 top_k（|标准化总效应|）
  min_sign_consistency: 0.9               # 关键基因 / 程序：全部 E1 fold × 种子模型中与共识同号的比例下限
  prog_enrich_fdr: 0.05                   # 关键程序：标志基因上标准化总效应的富集 z（BH-FDR）上限
  key_max_genes: 50                       # 每 head 最多报告的关键基因数（按 |全数据共识效应| 排序）
  sig_sizes: [20, 50, 100]                # 用于验证链的 top-k 基因集（带模型符号）
  n_random_sets: 1000                     # 随机基因集零分布（同 stage 12 口径）
  n_perm: 1000                            # 供体 / 样本标签置换
  diag_variants:                          # 诊断（非冻结设计）：程序通路为何不被使用；只在 FULL 上训练
    noHSIC: {lambda_hsic: 0.0}
    noResid: {gene_resid: false}          # 强制全部信号经程序通路（dev 未评估此变体；仅作解释对照）
  kpmp_datasets: [snRNA, scRNA]           # snRNA 主、scRNA 复现
  kpmp_contrasts: [DKD_vs_REF, DKD_vs_HKD, DKD_vs_OTHER_CKD]
  spec_min_log2cpm: 1.0                   # 细胞类型定位：参考供体均值 log2CPM 低于此视为未表达
  gse142025: {series: GSE142025-RNAseq, early: Early_DN, late: Advanced_DN}
  genesets:                               # Enrichr 文本库（下载后本地缓存 + md5；背景 = 基因宇宙）
    url: "https://maayanlab.cloud/Enrichr/geneSetLibrary?mode=text&libraryName="
    libraries: [MSigDB_Hallmark_2020, Reactome_2022, GO_Biological_Process_2023, KEGG_2021_Human]
    disease_libraries: [DisGeNET, Jensen_DISEASES]
    disease_terms_regex: "(?i)diabetic nephropath|diabetic kidney"
    chrom_library: Chromosome_Location_hg19   # 性染色体基因标记（chrY 与 XIST：性别构成混杂的提示）
    cache: data/external/genesets
    min_size: 10
    max_size: 500
    fdr: 0.05
# ---- stage 19：泛 CKD 共享疾病–对照程序（SCP）与病种特异残差；以下键均为新增，不改冻结段 ----
shared_program:
  sources:                                # 带对照的来源单元（非 DKD 病人 vs 对照）；独立队列一律不作来源
    GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983, GSE93798-GPL22945]
    TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983]
  never_source: [GSE175759-RNAseq, GSE142025-RNAseq, GSE115857-GPL14951, GSE162830, KPMP, GSE166239]
  min_group: 5                            # 单元内病人 / 对照最少样本数；逐病种 vs 对照一致率同阈值
  core:                                   # 核心基因阈值（只看来源单元；在查看任何独立数据前固定）
    fdr: 0.01                             # DL 随机效应 z 检验 BH-FDR
    min_abs_g: 0.8                        # |合并 Hedges g|
    sign_frac: 1.0                        # 与合并方向同号的来源比例
    loo_max_p: 0.05                       # 留一来源：剩余来源的合并 P
    loo_min_abs_g: 0.5                    # 留一来源：剩余来源的 |合并 g|（且同号）
  n_representative: 15                    # 每方向报告的代表基因数（按 |g_re|）
  dkd_check_units:                        # DKD 外部检验：DKD vs 对照 效应与 SCP（去掉该单元后重估）的一致性
    GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE30528-GPL571CEL, GSE96804-GPL17586]
    TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE30529-GPL571CEL, GSE142025-RNAseq]
  composition:                            # 2b：BayesPrism 组成（stage 16 run/all）
    run_tag: all
    references: [scRNA, snRNA]            # scRNA 为 stage 16 主参照
    units:
      GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983, GSE93798-GPL22945, GSE30528-GPL571CEL, GSE96804-GPL17586]
      TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE30529-GPL571CEL, GSE133288-GPL19983, GSE182380-RNAseq,
            GSE175759-RNAseq, GSE142025-RNAseq, GSE115857-GPL14951]
    ref_compartment: {GLOM: GLOM, TUB: TUB}   # 单元区室 → θ 的区室键（WHOLE 单元在 θ 表中为 WHOLE，按 TUB 类型集）
    eps: 0.001
    cv_folds: 5
    cv_reps: 10
    min_unit_n: 15
  kpmp:                                   # 2c：KPMP 供体 pseudobulk（stage 14 缓存；细胞类型口径 = kpmp.map_to_stage13）
    datasets: [snRNA, scRNA]              # snRNA 主（有 eGFR 与健康经皮活检）、scRNA 复现
    ckd_groups: [DKD, OTHER_CKD]          # CKD = DKD ∪ HKD ∪ Other（stage 14 分组）
    procurement_col: {snRNA: TissueCollection, scRNA: Tissue.Type}
    percutaneous: Percutaneous Needle Biopsy
    lfc_min: 0.25                         # 「细胞内状态改变」：同号且 |log2FC| > 该值且置换 P < state_max_p
    state_max_p: 0.05
    comp_min_top_share: 0.5               # 「组成型」基因：参考中最高表达类型的线性份额下限（细胞类型特异）
    min_expr_log2cpm: 1.0
    n_perm: 1000
    proc_min_abs_g: 0.8                   # 取材敏感：健康供体 手术取材 vs 经皮活检 的 |g| 下限，且方向模拟「对照」
    ieg: [FOS, FOSB, JUN, JUNB, JUND, EGR1, EGR2, EGR3, ATF3, NR4A1, NR4A2, NR4A3, DUSP1, DUSP6, ZFP36, ZFP36L1,
          IER2, IER3, IER5, KLF2, KLF4, KLF6, PPP1R15A, CCN1, CCN2, BTG2, GADD45B, GADD45G, SOCS3, CEBPD, MYC,
          HSPA1A, HSPA1B, DNAJB1, RHOB, CSRNP1, MAFF, NFKBIA, SIK1, TRIB1, KLF10, EGR4, FOSL1, FOSL2, SGK1]
  replicate:                              # 3：独立数据（不参与任何选择）；区室 = 用哪套 SCP 核心
    cohorts:
      GSE162830: {source: indep, core: GLOM, positive: [DKD, ING]}
      KPMP: {source: indep, core: TUB, positive: [DKD, HT, OTHER]}
      GSE166239: {source: indep, core: TUB, positive: [DKD, HT]}
      GSE175759-RNAseq: {source: interim, core: TUB, positive: [IgAN, MCD, MN, DKD, LN, FSGS]}
      GSE142025-RNAseq: {source: interim, core: TUB, positive: [DKD]}
      GSE115857-GPL14951: {source: interim, core: TUB, positive: [IgAN, MCD, MN, FSGS]}
    also_dkd_control: [GSE30528-GPL571CEL, GSE96804-GPL17586, GSE30529-GPL571CEL]   # 未作来源的 DKD–对照队列（补充）
    n_random_sets: 1000
    n_boot: 2000
  residual:                               # 4：病种特异残差（病人内回归掉 SCP 分数后 病种 vs 其余病人）
    units:
      GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983]
      TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE133288-GPL19983, GSE182380-RNAseq]
    diseases: [DKD, LN, RPGN, MN, FSGS, MCD, IgAN, HT]
    min_group: 5
    sig_n: 50                             # 独立检验用签名：每方向 top-n（按 |g_re|，要求单元间同号）
    n_top_report: 20
    n_perm: 1000                          # 细胞程序富集（基因置换）
    tests:                                # 独立数据中能检验的对比：[队列, 病种签名区室, 阳性, 阴性]
      - [GSE175759-RNAseq, TUB, IgAN, [MCD, MN, DKD, LN, FSGS]]
      - [GSE175759-RNAseq, TUB, MCD, [IgAN, MN, DKD, LN, FSGS]]
      - [GSE175759-RNAseq, TUB, MN, [IgAN, MCD, DKD, LN, FSGS]]
      - [GSE175759-RNAseq, TUB, LN, [IgAN, MCD, MN, DKD, FSGS]]
      - [GSE175759-RNAseq, TUB, DKD, [IgAN, MCD, MN, LN, FSGS]]
      - [GSE175759-RNAseq, TUB, FSGS, [IgAN, MCD, MN, DKD, LN]]
      - [GSE115857-GPL14951, TUB, IgAN, [MCD, MN, FSGS]]
      - [GSE115857-GPL14951, TUB, MCD, [IgAN, MN, FSGS]]
      - [GSE115857-GPL14951, TUB, MN, [IgAN, MCD, FSGS]]
      - [GSE162830, GLOM, DKD, [ING]]
      - [KPMP, TUB, DKD, [HT, OTHER]]
      - [KPMP, TUB, HT, [DKD, OTHER]]
      - [GSE166239, TUB, DKD, [HT]]
      - [GSE166239, TUB, HT, [DKD]]
    min_test_n: 3                         # 独立检验每组最少样本（< 5 标记为描述性）
    replicate_pct: 0.95                   # 「复现」：AUROC 高于同大小随机签名的该百分位（且组数 ≥ 5）
# ---- stage 20：SCP 细胞内状态成分与 KPMP 适应不良 / 修复失败小管状态（生物学解释，非方法比较）；以下键均为新增 ----
repair_state:
  datasets: [snRNA, scRNA]                # snRNA 主（皮质、有 eGFR）；scRNA 复现（解离偏倚：全细胞、应激 / 状态占比方向不同）
  compartment: TUB                        # 使用的 SCP 核心（71% 细胞内状态成分来自 TUB 核心）；GLOM 仅作补充
  lineages:                               # 谱系 → 状态 → KPMP SubclassLevel2（两个数据集的名称并集；缺失的名称自动忽略）
    PT:
      normal: [PT-S1, PT-S2, PT-S3, PT-S1/S2, PT-S2/S3]
      aPT: [aPT]                          # adaptive / maladaptive（KPMP 定义）
      frPT: [frPT]                        # failed-repair（atlas v2）
      dPT: [dPT]                          # degenerative
      cycPT: [cycPT]                      # cycling
    TAL:
      normal: [C-TAL, M-TAL, C/M-TAL]     # MD 不计入 TAL 状态分析（独立细胞类型）
      aTAL: [aTAL]
      frTAL: [frTAL]
      dTAL: [dC-TAL, dM-TAL, dTAL]
      cycTAL: [cycTAL]
  repair_states: {PT: [aPT, frPT], TAL: [aTAL, frTAL]}   # 「适应不良 / 修复失败」主定义 = adaptive ∪ failed-repair
  categories:                             # 供体病理类别（供体水平唯一取值）；CKD = DKD ∪ HKD ∪ OTHER（与 stage 19 同口径）
    snRNA:
      REF: {ConditionCategory: [Healthy Reference]}
      DKD: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Diabetic Kidney Disease]}
      HKD: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Hypertensive Kidney Disease]}
      OTHER: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Other]}
      CKD_unadj: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Cannot be determined, Not available]}
      AKI: {ConditionCategory: [Acute Kidney Injury]}
      DM_R: {ConditionCategory: [Diabetes Mellitus - Resilient]}
    scRNA:
      REF: {EnrollmentCategory: [Healthy Reference Tissue]}
      DKD: {EnrollmentCategory: [Chronic Kidney Disease], AdjudicationCategory: [Diabetic Kidney Disease]}
      HKD: {EnrollmentCategory: [Chronic Kidney Disease], AdjudicationCategory: [Hypertensive Kidney Disease]}
      OTHER: {EnrollmentCategory: [Chronic Kidney Disease], AdjudicationCategory: [Other]}
      CKD_unadj: {EnrollmentCategory: [Chronic Kidney Disease], AdjudicationCategory: [Cannot be determined, Unknown]}
      AKI: {EnrollmentCategory: [Acute Kidney Injury]}
      DM_R: {EnrollmentCategory: [Diabetes Mellitus - Resilient]}
  ckd: [DKD, HKD, OTHER]
  min_cells: 20                           # 供体 × 状态 pseudobulk 最少细胞数（同 kpmp.min_cells）
  min_donors: 5                           # 配对状态程序 / 组间检验每组最少供体
  program:                                # 1：状态程序（供体内配对：状态 vs 同供体正常细胞；不读疾病标签）
    min_log2cpm: 1.0                      # 基因在两者之一的供体均值 log2CPM 下限
    fdr: 0.05                             # 配对 t 检验 BH-FDR
    lfc: 1.0                              # |平均 log2FC| 下限
    rep_lfc: 0.5                          # scRNA 复现：同号且 |log2FC| ≥ 该值
    n_top: 100                            # 打分用程序：每方向按 d_z 取 top-n（FDR 与 lfc 同时满足）
  n_perm: 1000                            # 供体标签置换 / 符号翻转
  n_boot: 1000                            # 供体 bootstrap（Shapley 份额 CI）
  n_random_sets: 1000                     # 表达量分层匹配的随机基因集
  n_expr_bins: 10
  bulk:                                   # 4：bulk（BayesPrism 状态层 θ，stage 16 run/all；主参照 scRNA）
    theta_run: all
    reference: scRNA
    units: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE30529-GPL571CEL, GSE133288-GPL19983, GSE182380-RNAseq,
            GSE175759-RNAseq, GSE142025-RNAseq, GSE115857-GPL14951]
    diseases: [DKD, LN, RPGN, MN, FSGS, MCD, IgAN, HT]
    min_group: 5
    eps: 0.001                            # logit 份额截断
    clinical_cohorts: [GSE175759-RNAseq, GSE142025-RNAseq, GSE115857-GPL14951, KPMP, GSE166239]   # 只作检验
# ---- stage 21：稳健性补充分析（A1–A8）；只写 results/21_robustness，不改任何已有 stage 的输出；以下键均为新增 ----
robustness21:
  n_perm: 1000                            # 样本标签置换 / 旋转次数（A1、A5）
  n_rot: 1000
  n_boot: 1000                            # 患者 / 供体 bootstrap
  de_fdr: 0.05                            # A1：单元内疾病 vs 对照 显著基因（Welch t on ranks，BH）
  min_group: 3                            # A1：与 stage 11 shift_share 相同的最小组
  proc_min_abs_g: 0.8                     # A3：全基因取材敏感 = |g(健康手术 vs 健康经皮, snRNA)| ≥ 该值且方向模拟对照（同 stage 19c）
  gene_variants: [full, no_proc, no_ieg, no_proc_ieg]
  ratio_thresholds: [0.0, 0.1, 0.15, 0.2, 0.25, 0.3]   # A5：min_r_dd 敏感性
  injection:                              # A4：真实 ERCB 病人中的已知信号注入
    units: {TUB: ERCB_TUB_H1, GLOM: ERCB_GLOM_H1}
    n_pseudo: 20                          # 伪病种人数（random / severity_linked 两种抽取）
    n_genes: 50                           # 注入基因数
    deltas: [0.25, 0.5, 1.0, 1.5]         # 注入效应（病人间 SD 单位）
    n_rep: 100
    n_null_sets: 200                      # 调整 AUROC 的随机签名零分布
    severity_link_g: null                 # null = 取该单元真实 DKD 相对其余病人的 SCP 分数差（stage 19e）
    detect_power: 0.8
  shapley_gpu: {device: "cuda:0", batch: 32}
  a7_programs: [PT:rfPT, PT:aPT, PT:frPT, TAL:rfTAL]
# ---- stage 22：第三轮补充分析（S1–S3）；只写 results/22_sensitivity，不改任何已有 stage 的输出；以下键均为新增 ----
sensitivity22:
  n_perm: 1000                            # S1：Spearman / 偏 Spearman 的置换次数（同 stage 20d）
  n_boot: 2000                            # S1：供体 bootstrap；S2：患者 bootstrap（按组分层，同 stage 19d）
  s1:
    dataset: snRNA
    states: [PT:frPT, TAL:frTAL, PT:aPT, TAL:aTAL, PT:rfPT, TAL:rfTAL]
    subsets:                              # 供体子集（KPMP 类别）；AKI 排除前后并列
      all_categorised: [REF, DKD, HKD, OTHER, AKI, DM_R, CKD_unadj]
      all_categorised_noAKI: [REF, DKD, HKD, OTHER, DM_R, CKD_unadj]
      REF+CKD: [REF, DKD, HKD, OTHER]
      CKD: [DKD, HKD, OTHER]
      AKI: [AKI]
    min_donors: 10
  s2:
    gene_set: full                        # 主分析基因集（stage 19d）
    contrasts: [patients_vs_control, DKD_vs_control]
  s3:
    reference: scRNA                      # 与 stage 16 主参照相同（scRNA_TUB）
    normal_pt: [PT-S1/S2, PT-S2/S3, PT-S1, PT-S2, PT-S3]
    injured_pt: [aPT, frPT]
    n_holdout: 10                         # 留出供体（aPT、frPT 各 ≥20 个细胞，正常 PT ≥50 个）；参照只用其余供体
    min_cells_state: 20
    min_cells_normal: 50
    shares: [0.0, 0.05, 0.1, 0.2, 0.3, 0.4]    # 已知 aPT+frPT 占 PT 读数的份额
    apt_to_frpt: [2, 1]                   # aPT : frPT（KPMP DKD 供体中约 2:1）
    depth: 20000000
    ercb_genes_from: GSE104954-GPL22945   # ERCB 小管间质芯片测到的基因（限制基因覆盖的场景）
    modes:                                # 测量场景：seq = 泊松计数；array = log2(CPM·2^偏倚 + 2^floor) + 噪声 → 2^x（与 stage 16 芯片线性化相同）
      seq_all: {kind: seq, genes: all}
      seq_ercb: {kind: seq, genes: ercb}
      array_ercb: {kind: array, genes: ercb, bias_sd: 0.5, floor_log2: 3.0, noise_sd: 0.1}
      array_ercb_strong: {kind: array, genes: ercb, bias_sd: 1.0, floor_log2: 5.0, noise_sd: 0.2}
    n_cores: 32
    out_dir: data/processed/deconv/sensitivity22
