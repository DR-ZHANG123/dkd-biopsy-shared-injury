  borrow_prob: 0.3                        # 每个细胞类型以该概率换用另一供体的谱（跨供体状态多样性）
  genes: {max_missing: 0.0, min_ref_log2cpm: 1.0, domain_max_absdiff: 0.2, marker_min_log2cpm: 5.0}   # 基因：bulk 全覆盖 ∩ 参照表达 ∩ 秩域偏差过滤（见 lib/deconv_fast_ref）
  types:                                  # 细胞类型 → KPMP SubclassLevel2；每个区室一套
    GLOM:
      PODO: [POD, dPOD]
