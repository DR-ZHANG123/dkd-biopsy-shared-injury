    chain_length: 1000
    burn_in: 500
    thinning: 2
    seed: 20260928
  features:
    eps: 0.001                            # CLR / logit 的下限
    z_min_share: 0.3                      # 类型 k「拥有」基因 g：参照中 k 的 CPM 占全部类型 CPM 之和的比例下限
    z_min_genes: 20                       # 拥有基因少于该数的类型不产生 Z 特征
  eval:                                   # stage 16d：dev 非 DKD 任务（stage 15 的 fold / cell / 协变量 / 指标原样复用）
