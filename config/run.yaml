seed: 20260928
paths: {raw: data/raw, interim: data/interim, processed: data/processed, results: results, models: models}
old_project_raw: upstream/data_raw          # 同项目旧版已下载的 CEL/series matrix（只读）
old_project_processed: upstream/data_processed
overlap: {corr_threshold: 0.98, resid_pcs: 10, resid_min: 0.5, resid_min_within: 0.8, sex_margin: 0.3, min_common_genes: 2000}
genes: {n_nodes: 5000, min_platform_coverage: 1.0}
cohorts:
  # ERCB：同一批 CEL 以不同 CDF 重复存放于以下 series；按芯片批次分 cohort（HG-U133A = H1–H5 批，U133 Plus 2.0 = H7 批）
  ercb_series: [GSE104948, GSE104954, GSE99339, GSE47183, GSE37460, GSE32591]
  ercb_platform_batch: {GPL24120: H1, GPL19184: H1, GPL14663: H1, GPL22945: H7, GPL19109: H7, GPL11670: H7}
  single_series_cohorts: [GSE30528-GPL571CEL, GSE30529-GPL571CEL, GSE96804-GPL17586]
  external: {GSE175759-RNAseq: TUB, GSE142025-RNAseq: TUB}   # 值 = 用哪个区室的评估 cohort 训练
  t2_negatives: [IgAN, FSGS, MCD, FSGS_MCD, MN, LN, HT, RPGN]
  min_class_n: 5
  external_min_class_n: 3        # 外部测试 cohort 低于 min_class_n 时仅作描述性报告
graphs:
  string_version: "12.0"
  string_min_score: 700
  coexpr_k: 10
  coexpr_controls_only: true
  coexpr_datasets: [GSE131882, GSE209781]   # 旧版目录 data_processed/scrna/<id>_annotated.h5ad（只读）
  sc_donor_col: sample
  sc_group_col: group
  sc_celltype_col: cell_type
  sc_control_value: Control
  coexpr_exclude_celltypes: [LowQuality]
  coexpr_n_hvg: 2000                 # 对照细胞上重算 PCA 所用 HVG
  coexpr_n_pcs: 30
  coexpr_cells_per_metacell: 30      # 供体×细胞类型内 KMeans(PCA) 聚合
  coexpr_max_metacells_per_group: 40 # 防止大细胞类型（PT）主导相关
  coexpr_min_cells_per_group: 15
  coexpr_min_metacell_frac: 0.01     # 两个数据集都需在 ≥ 该比例 metacell 中检出
  rewire_n_seeds: 5
  rewire_swap_factor: 10             # 成功交换次数 = factor × 边数
model: {layers: 3, hidden: 64, heads: 4, dropout: 0.1, embed_dim: 64}
pretrain:
  mask_frac: 0.15
  drop_frac: [0.2, 0.4]
  epochs: 200
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-2
  val_frac: 0.1
probe: {C_grid: [0.001, 0.01, 0.1, 1.0, 10.0], seeds: 10}
eval: {n_boot: 2000, label_fracs: [0.25, 0.5, 1.0], noninferiority_margin: 0.05}
iteration: {max_design_rounds: 5}
# ---- 模型线（stage 06–09）新增参数；以下键均为新增，不改上方已有值 ----
tasks:                                   # 下游任务的正/负类（diagnosis 取值，来自 stage 03 映射）
  T1: {pos: [DKD], neg: [CONTROL]}
  T2: {pos: [DKD], neg: [IgAN, FSGS, FSGS_MCD, MCD, MN, LN, HT, RPGN]}
corpus:                                  # 每个 fold 的预训练 / PCA 语料取哪些区室（按 fold 的 compartment）
  GLOM: [GLOM, WHOLE]
  TUB: [TUB, WHOLE]
  WHOLE: [GLOM, TUB, WHOLE]
pretrain_run:
  variants: [full, noedge, rewired, ppi_only, coexpr_only]
  seeds: [0]                             # 编码器预训练种子（可扩展）
  patience: 20                           # 早停：验证损失不降的 epoch 数
  min_epochs: 10
  warmup_epochs: 5
  grad_clip: 1.0
  amp_dtype: bf16
  recon_weight: 10.0
  vicreg_weight: 0.04
  proj_dim: 256                          # VICReg expander 维度（只用于预训练，不进入下游 embedding）
  eval_batch_size: 64
  dataloader_seed_offset: 1000
baselines:
  lasso_C_grid: [0.01, 0.0316, 0.1, 0.316, 1.0, 3.16, 10.0]
  pca_components: 64
  standardize: true
  max_iter: 5000
inner_cv: {min_cohorts: 2, fallback_kfold: 5}   # inner CV：训练队列 ≥2 且各留出队列可用时 leave-one-cohort-out，否则分层 k 折
eval_ext: {min_per_class: 2}   # label-efficiency 抽样时每 cohort 每类至少保留的样本数（inner CV 需要 ≥2）
supervised:                              # B5（不预训练，直接监督）与 RRG-full-ft（全参微调）
  enable_finetune: true
  epochs: 100
  patience: 15
  batch_size: 16
  lr_scratch: 1.0e-3
  lr_finetune_encoder: 3.0e-5
  lr_finetune_head: 1.0e-3
  weight_decay: 1.0e-2
  val_frac: 0.2                          # 训练 cohort 内分层留出，用于早停与 Youden 阈值
compare:
  pairs:                                 # (A, B)：报告 A − B 的 ΔAUROC
    - [RRG-full, B1-rankLASSO]
    - [RRG-full, B2-PCA]
    - [RRG-full, B3-noedge]
    - [RRG-full, B4-rewired]
    - [RRG-full, B5-scratch]
    - [RRG-full, B6-ppi]
    - [RRG-full, B6-coexpr]
    - [RRG-full-ft, B1-rankLASSO]
    - [B2-PCA, B1-rankLASSO]
  rnaseq_technology_regex: "(?i)rna-?seq"
model_ext: {readout: hybrid, readout_channels: 2, rewire_mode: induced, global_context: true}   # readout ∈ attention（方案原设）/ genewise / hybrid；rewire_mode ∈ induced（在诱导子图上保度数重连）/ file（stage 05 文件）；理由见 01_execution_log
injury:
  min_controls: 5
  min_disease: 10
  min_source_frac: 0.5
  top_k: 200
  n_strata: 4
  n_random_sets: 1000
  compartments:
    GLOM: {eval: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE96804-GPL17586, GSE30528-GPL571CEL],
           source: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983, GSE93798-GPL22945]}
    TUB:  {eval: [ERCB_TUB_H1, ERCB_TUB_H7, GSE30529-GPL571CEL, GSE142025-RNAseq],
           source: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE175759-RNAseq]}
celltype:
  keep: [PT, PT_injured, LOH, DCT, CNT_PC, IC, PODO, PEC, ENDO, ENDO_PT, STROMA, PERI, BCELL, TCELL, NK, MAC, MAST, NEUTRO]
  min_cells: 20
  min_log2cpm: 4.0
  n_markers: 50
  min_group: 5
  n_perm: 1000
  n_top_validate: 300
  units:
    GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983, GSE93798-GPL22945, GSE96804-GPL17586]
    TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE133288-GPL19983, GSE182380-RNAseq, GSE175759-RNAseq, GSE142025-RNAseq]
# ---- stage 15：病种身份表示学习（RRG-ID，贡献 2）；以下键均为新增 ----
model2:
  units:
    GLOM: [ERCB_GLOM_H1, ERCB_GLOM_H7, GSE108109-GPL19983, GSE93798-GPL22945, GSE96804-GPL17586, GSE30528-GPL571CEL]
    TUB: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983, GSE133288-GPL19983, GSE182380-RNAseq, GSE200818-GPL19983,
          GSE69438-GPL11670, GSE115857-GPL14951, GSE30529-GPL571CEL]
  never_use: [GSE142025-RNAseq, GSE175759-RNAseq]      # 外部测试队列：不进训练也不进 dev 评估
  consortia:
    ERCB: [ERCB_GLOM_H1, ERCB_GLOM_H7, ERCB_TUB_H1, ERCB_TUB_H7]
    NEPTUNE: [GSE108109-GPL19983, GSE108112-GPL19983, GSE133288-GPL19983, GSE182380-RNAseq, GSE200818-GPL19983]
  labels:
    head: [DKD, FSGS, MCD, MN, RPGN, IgAN, LN, HT]
    neg_only: [FSGS_MCD, OTHER]
    control: [CONTROL]
    exclude: [TMD]
  eval:
    min_test_pos: 5
    min_test_neg: 5
    min_train_pos: 5
    e2_diseases: [FSGS, MCD, MN, RPGN]
    e3_folds: 5
    igan_analog: {compartment: GLOM, test_unit: ERCB_GLOM_H1, disease: IgAN}
    e4:                           # 耦合模拟（见 m2_data._e4_folds）：d–对照队列 = 含对照的 NEPTUNE series
      diseases: [FSGS, MCD, MN, RPGN]
      d_cohort: {GLOM: GSE108109-GPL19983, TUB: GSE108112-GPL19983}
  features_cache: data/interim/m2_features.parquet
  markers:                        # 细胞类型程序种子（stage 14 KPMP 健康参考；marker_source: stage13 为旧标志对照）
    kpmp_file: results/14_kpmp/markers_kpmp.tsv
    kpmp_references: [snRNA, scRNA, snRNA_endosplit, scRNA_endosplit]
    kpmp_drop: [ENDO]
  baseline_max_genes: 5000        # 对照 LASSO/L2/cPCA：按训练集方差取 top 基因（全宇宙 inner CV 太慢）
  baseline_center_level: stratum
  cpca_k: 20
  cpca_alphas: [1.0, 10.0, 100.0]
  n_jobs: 48
  defaults:                       # RRG-ID 冻结候选（dev 非 DKD 任务选定，理由见 notes/01_execution_log.md stage 15）
    marker_source: kpmp           # 程序种子：KPMP 健康参考标志（stage 14）
    graph: none                   # 基因图扩散在 dev 上无增益（coexpr / STRING / 重连 ≈ 无图），冻结为最简
    rewire_seed: 0
    diffuse_hops: 2
    diffuse_beta: 0.5
    program_size: 100
    use_programs: true
    learn_gates: false            # 可学门控 / 自由程序在 dev 上过拟合，冻结为固定程序
    gate_l2: 1.0e-3
    n_free: 0
    free_l1: 1.0e-4
    z_dim: 16
    z_mlp: false
    gene_resid: true              # 基因级残差 head：程序之外的病种信号
    resid_l2: 1.0e-3
    resid_standardize: false
    lambda_supcon: 0.0            # 加权 SupCon 在 dev 上一致变差，不纳入
    lambda_hsic: 1.0
    hsic_mode: conditional        # z ⟂ 共享轴 | 病种
    hsic_on: z
    gamma: 0.0                    # 共享轴匹配权重在 dev 上无增益，不纳入
    match_bw: 0.5
    use_controls: true
    control_weight: 1.0
    compare_level: mixed          # stratum 内成对 + 全体合并成对
    pool_weight: 1.0
    pos_scope: any
    supcon_center: stratum
    tau: 0.2
    wd: 1.0e-3
    lr: 1.0e-2
    epochs: 300
    n_seeds: 5
  methods:                        # 主方法与消融（相对 defaults 的覆盖）
    RRG-ID: {}
    RRG-ID-noHSIC: {lambda_hsic: 0.0}
    RRG-ID-noProg: {use_programs: false, lambda_hsic: 0.0}
    RRG-ID-stratumOnly: {compare_level: stratum}
    RRG-ID-pooledOnly: {compare_level: all}
    RRG-ID-noCtrl: {use_controls: false}
    RRG-ID+coexpr: {graph: coexpr}
    RRG-ID+rewired: {graph: rewired}
    RRG-ID+STRING: {graph: ppi}
    RRG-ID+match: {gamma: 0.5}
    RRG-ID+SupCon: {lambda_supcon: 0.5, pos_scope: within}
  baselines: [B2-PCA, B-rankLASSO, B-L2, B-L2-unitcenter, B-L2-ucmix, B-cPCA, B-prog-L2, B-injury]
  freeze:
    file: results/15_model/FROZEN_DESIGN.json
    # 内容 = 主方法完整解析配置 + 对照/消融列表 + 代码文件 sha256 + config_sha；由 15_freeze.py 生成，作者 git 提交后才可跑 15_final_dkd.py
  dev_defaults:                   # 设计迭代期（dev_variants）使用的默认配置，保留以复现迭代记录
    graph: coexpr                 # coexpr / ppi / none / rewired
    marker_source: stage13        # 迭代前期用 stage 13 标志；R5-* 起显式指定 kpmp
    rewire_seed: 0
    diffuse_hops: 2
    diffuse_beta: 0.5
    program_size: 100
    learn_gates: true
    gate_l2: 1.0e-3
    n_free: 4
    free_l1: 1.0e-4
    z_dim: 16
    z_mlp: false
    lambda_supcon: 0.5
    lambda_hsic: 1.0
    gamma: 1.0                    # 匹配强度：0 = 不按共享轴匹配，1 = 完全按核权重
    match_bw: 0.5                 # 核带宽 = match_bw × stratum 内 a 的 SD
    use_controls: true
    control_weight: 1.0
    compare_level: stratum        # stratum = 单元 × series；unit = 单元
    supcon_center: stratum
    tau: 0.2
    wd: 1.0e-3
    lr: 1.0e-2
    epochs: 300
    n_seeds: 5
  # 设计迭代用变体（只在 dev 非 DKD 任务上比较；冻结时把选中的配置写进 methods）
  dev_variants:
    R2-rank: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2}
    R2-rank-r3: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-3}
    R2-rank-r1: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-1}
    R2-rank-pooled: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, compare_level: all}
    R2-rank-unit: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, compare_level: unit}
    R2-full: {gene_resid: true, resid_l2: 1.0e-2, gamma: 0.5, hsic_mode: conditional}
    R2-cond: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional}
    R2-match: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.5, gene_resid: true, resid_l2: 1.0e-2}
    R2-sc: {lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2}
    R2-sc-within: {lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, pos_scope: within}
    R2-rank-free16: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, n_free: 16}
    R2-geneonly: {lambda_supcon: 0.0, lambda_hsic: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, z_dim: 1, learn_gates: false, n_free: 0, wd: 10.0}
    R3-cond-r3: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-3, hsic_mode: conditional}
    R3-cond-h3: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, lambda_hsic: 3.0}
    R3-cond-fixed: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, learn_gates: false, n_free: 0}
    R3-cond-match: {lambda_supcon: 0.0, gamma: 0.5, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional}
    R3-cond-scw: {lambda_supcon: 0.5, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, pos_scope: within}
    R3-cond-noctrl: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, use_controls: false}
    R3-cond-unit: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, compare_level: unit}
    R3-cond-e100: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, epochs: 100}
    R3-cond-marg: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: marginal}
    R3-cond-nograph: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, graph: none}
    R3-condh: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-2, hsic_mode: conditional, hsic_on: h}
    R3-condh-r3: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, resid_l2: 1.0e-3, hsic_mode: conditional, hsic_on: h}
    R5-cond-r3: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, marker_source: kpmp}
    R5-cond-r3-s13: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, marker_source: stage13}
    R5-cond-std: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, marker_source: kpmp}
    R5-cond-std-r2: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-2, resid_standardize: true, marker_source: kpmp}
    R5-mix: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, compare_level: mixed, pool_weight: 0.5, marker_source: kpmp}
    R5-mix1: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, compare_level: mixed, pool_weight: 1.0, marker_source: kpmp}
    R5-mix-std: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, compare_level: mixed, pool_weight: 0.5, marker_source: kpmp}
    R5-mix-std1: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, compare_level: mixed, pool_weight: 1.0, marker_source: kpmp}
    R5-pool-std: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, compare_level: all, marker_source: kpmp}
    R5-mix-std-h: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, compare_level: mixed, pool_weight: 0.5, hsic_on: h, marker_source: kpmp}
    R5-mix-std-nohsic: {lambda_supcon: 0.0, gamma: 0.0, gene_resid: true, lambda_hsic: 0.0, resid_l2: 1.0e-3, resid_standardize: true, compare_level: mixed, pool_weight: 0.5, marker_source: kpmp}
    R5-mix-std-match: {lambda_supcon: 0.0, gamma: 0.5, gene_resid: true, hsic_mode: conditional, resid_l2: 1.0e-3, resid_standardize: true, compare_level: mixed, pool_weight: 0.5, marker_source: kpmp}
shared_axis_tests:
  n_split: 50
  split_units: [ERCB_GLOM_H1, ERCB_GLOM_H7, ERCB_TUB_H1, ERCB_TUB_H7]
  min_r_dd: 0.2
  ratio_pairs:
    - [GSE30529-GPL571CEL, ERCB_TUB_H1]
    - [GSE30529-GPL571CEL, ERCB_TUB_H7]
    - [ERCB_TUB_H1, ERCB_TUB_H7]
    - [ERCB_TUB_H7, ERCB_TUB_H1]
    - [GSE30528-GPL571CEL, ERCB_GLOM_H1]
    - [GSE30528-GPL571CEL, ERCB_GLOM_H7]
    - [GSE96804-GPL17586, ERCB_GLOM_H1]
    - [GSE96804-GPL17586, ERCB_GLOM_H7]
    - [ERCB_GLOM_H1, ERCB_GLOM_H7]
    - [ERCB_GLOM_H7, ERCB_GLOM_H1]
    - [GSE142025-RNAseq, ERCB_TUB_H1]
    - [GSE142025-RNAseq, ERCB_TUB_H7]
  egfr_unit: GSE175759-RNAseq
  egfr_axis_sources: [ERCB_TUB_H1, ERCB_TUB_H7, GSE108112-GPL19983]
  egfr_marker_genes: [EGF, LCN2, HAVCR1, VCAM1, COL1A1, UMOD]
kpmp:                                    # stage 14：KPMP 参照与细胞类型结论的独立验证（CELLxGENE KPMP atlas v2.0）
  datasets:                              # 计数取 raw/X（整数 UMI），基因名取 var 的 feature_name；两个数据集的 obs 列名不同，分组条件逐数据集给出
    snRNA:
      file: data/raw/kpmp/06b8d9c2-0bde-48bd-88d9-730993fc95e2.h5ad
      dataset_id: 7ff0197b-d175-49bf-b4fa-150fe0995d93
      meta_cols: [ConditionCategory, Conditions.Subtype, AdjudicationCategory, TissueCollection, region, Age, sex, diabetes_history, hypertension, "Baseline eGFR (ml/min/1.73m2) (Binned)", assay]
      cell_filter: {region: [Cortex, Cortex/Medulla]}     # 活检基本是皮质；去掉髓质 / 乳头标本，避免参照与活检的取材区域不一致
      groups:                            # 条件：列 → 允许值；同一组内各条件取交集
        REF: {ConditionCategory: [Healthy Reference]}
        DKD: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Diabetic Kidney Disease]}
        OTHER_CKD: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Hypertensive Kidney Disease, Other]}
        HKD: {ConditionCategory: [Chronic Kidney Disease], AdjudicationCategory: [Hypertensive Kidney Disease]}
        AKI: {ConditionCategory: [Acute Kidney Injury], AdjudicationCategory: [Acute Tubular Injury, Acute Interstitial Nephritis]}
