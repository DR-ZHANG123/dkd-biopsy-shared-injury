    GLOM:                                 # 肾小球 bulk：肾小球细胞分开建模；肾小管污染按粗类吸收
      <<: *common
      PODO: [POD, dPOD]
      PEC: [PEC]
      MES_VSMC: [MC, VSMC, VSMC/P, dVSMC, REN]
      DIST: [DTL1, DTL2, DTL3, dDTL, ATL, aATL, aDTL, dATL, C-TAL, C/M-TAL, M-TAL, dM-TAL, aTAL, dC-TAL, dTAL, frTAL, cycTAL, MD,
             DCT, aDCT, dDCT, CNT, aCNT, dCNT, CNT-PC, aCNT-PC, dDN, C-PC, M-PC, dM-PC, CCD-PC, aCCD-PC, dCCD-PC, OMCD-PC, aOMCD-PC,
             IMCD, dIMCD, C-IC-A, M-IC-A, dC-IC-A, dM-IC-A, IC-A, aIC-A, IC-B, tPC-IC]
    TUB:                                  # 肾小管间质 bulk：各段小管分开；肾小球上皮 / 系膜污染按粗类吸收
      <<: *common
      DTL_ATL: [DTL1, DTL2, DTL3, dDTL, ATL, aATL, aDTL, dATL]
      TAL: [C-TAL, C/M-TAL, M-TAL, dM-TAL, aTAL, dC-TAL, dTAL, frTAL, cycTAL, MD]
      DCT: [DCT, aDCT, dDCT]
      CNT: [CNT, aCNT, dCNT, CNT-PC, aCNT-PC, dDN]
      PC: [C-PC, M-PC, dM-PC, CCD-PC, aCCD-PC, dCCD-PC, OMCD-PC, aOMCD-PC, IMCD, dIMCD]
      IC: [C-IC-A, M-IC-A, dC-IC-A, dM-IC-A, IC-A, aIC-A, IC-B, tPC-IC]
