    baseline: B-L2
    methods:                              # 方法名 → 特征块
      B-L2: [RANK]
      D-COMP: [COMP]
      D-SF: [SF]
      D-COMP+SF: [COMP, SF]
      D-Z: [Z]
      D-COMP+Z: [COMP, Z]
      D-COMP+SF+Z: [COMP, SF, Z]
      B-L2+COMP: [RANK, COMP]
      B-L2+COMP+SF: [RANK, COMP, SF]
      D-RANK_Z: [RANK_Z]                  # 同基因集对照（Z 覆盖的基因上的组织平均秩）
      D-RESID: [RESID]                    # 组成残差秩
      D-COMP+RESID: [COMP, RESID]
      D-COMP|uc: ["COMP|uc"]              # 单元中心化（无标签批次校正）
      D-Z|uc: ["Z|uc"]
      D-COMP+Z|uc: ["COMP|uc", "Z|uc"]
      B-L2|uc: ["RANK|uc"]
    pairs:                                # 额外配对比较（A − B）
      - [D-Z, D-RANK_Z]                   # 同基因集：细胞内状态表示 vs 组织平均
      - [D-COMP+Z, D-Z]
      - [D-COMP+Z, D-COMP]
      - [D-RESID, B-L2]
