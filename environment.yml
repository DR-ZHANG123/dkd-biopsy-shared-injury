name: kir
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - statsmodels=0.14
  - pyarrow
  - pyyaml
  - h5py
  - matplotlib=3.9
  - networkx=3.3
  - scanpy=1.10
  - requests
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - torch_geometric==2.6.1
      - GEOparse==2.0.4
